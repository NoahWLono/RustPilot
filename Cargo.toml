[workspace]
members = ["crates/rustpilot-checksums", "crates/rustpilot-filters", "crates/rustpilot-migration"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
license = "GPL-3.0-or-later"
repository = "https://github.com/NoahWLono/RustPilot"

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
overflow-checks = true
